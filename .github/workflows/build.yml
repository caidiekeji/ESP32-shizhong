name: Build Firmware

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 PlatformIO 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PlatformIO
        run: pip install -U platformio

      - name: 编译固件
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          BEMFA_UID: ${{ secrets.BEMFA_UID }}
        run: pio run

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/esp32-clock/bootloader.bin
            .pio/build/esp32-clock/partitions.bin
            .pio/build/esp32-clock/firmware.bin
          if-no-files-found: error
