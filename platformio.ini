; ESP32-S3 N16R8 (16MB Flash + 8MB Octal PSRAM) 智能时钟
; 如果你的板子是经典 ESP32-WROOM（无 R8 PSRAM），把 board 改为 esp32dev，
; 删除 memory_type / psram_type 两行，并在 config.h 中把 I2C 引脚改为 21/22

[env:esp32-clock]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- 16MB Flash + 8MB OPI PSRAM (N16R8) ----
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; 和风天气 Key / 巴法云私钥 编译期注入（本地设环境变量；CI 用 GitHub Secrets）
    -D QWEATHER_KEY=\"${sysenv.QWEATHER_KEY}\"
    -D BEMFA_UID=\"${sysenv.BEMFA_UID}\"

lib_deps =
    adafruit/Adafruit AHTX0@^2.0.6
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.2.0
    olikraus/U8g2@^2.36.5
    knolleary/PubSubClient@^2.8
    nodaoli/ArduinoUZlib@^1.0.2
